name: CI — erp-frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: erp-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: erp-frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Verificação de tipos (tsc -b)
        run: npx tsc -b

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npx vitest run

      - name: Build de produção (garantir que compila)
        run: npm run build
        env:
          VITE_API_URL: http://localhost/api/v1
          VITE_APP_NAME: 'ERP Angola'

  comment:
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Comentar resultado no PR
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ needs.test.result }}';
            const emoji = conclusion === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} **CI erp-frontend**: ${conclusion}\n\ntsc --noEmit + ESLint + Vitest + build de produção.`,
            });
